side = "BOTH"

[[dependencies.tetra_addition]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tetra_addition]]
modId = "tetra"
type = "required"
versionRange = "[7.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tetra_addition]]
modId = "kubejs"
type = "optional"
versionRange = "[2101.7.0,)"
ordering = "AFTER"
side = "BOTH"
