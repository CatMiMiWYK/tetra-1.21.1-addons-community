modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "GPL-3.0-or-later"

[[mods]]
modId = "tetra_addition"
version = "${version}"
displayName = "TetraAddition"
authors = "_yi_ran_"
description = '''
A tetra addition that exposes Tetra utilities to KubeJS.
'''

[[mixins]]
config="tetra_addition.mixins.json"

[[dependencies.tetra_addition]]
