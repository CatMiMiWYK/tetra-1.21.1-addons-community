plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven { url = "https://maven.parchmentmc.org/" }
}

configurations.matching { it.name == 'neoFormRuntimeExternalTools' }.configureEach {
    transitive = false
}

configurations.configureEach {
    resolutionStrategy {
        force 'net.neoforged:accesstransformers:10.0.1'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation files(
            "libs/tetra-1.21.1-7.0.0.jar",
            "libs/mutil-1.21.1-7.0.0.jar",
            "libs/soul-fire-d-neoforge-1.21-6.1.0.jar",
            "libs/curios-neoforge-9.5.1+1.21.1.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('createMinecraftArtifacts') {
    enabled = false
}

def replaceProperties = [
        version             : project.version,
        loader_version_range: project.loader_version_range
]

processResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
