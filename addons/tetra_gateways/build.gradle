plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-1.21"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
}

configurations.configureEach {
    resolutionStrategy {
        force 'net.neoforged:accesstransformers:10.0.1'
    }
}

// 本机 .gradle 模块缓存被清理，NFRT 外部工具链无法离线解析。
// 复用同版本已生成的 Minecraft 工件（build/moddev/artifacts），跳过工件生成任务。
tasks.named('createMinecraftArtifacts') {
    enabled = false
}

dependencies {
    implementation files(
            "libs/tetra-1.21.1-7.0.0.jar",
            "libs/mutil-1.21.1-7.0.0.jar",
            "libs/GatewaysToEternity-1.21.1-5.1.0.jar",
            "libs/Placebo-1.21.1-9.9.4.jar",
            "libs/kubejs-neoforge-2101.7.2-build.381.jar",
            "libs/tetrajs-1.21-1.21.1-2001-6.9.0-1.0.2.jar"
    )
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            version                : version,
            minecraft_version      : minecraft_version,
            minecraft_version_range: "[${minecraft_version},1.22)",
            neo_version            : neo_version,
            neo_version_range      : "[21.1.0,)",
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}
